<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZetaPlus SaaS — App Dashboard Shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Chart.js for responsive analytics graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('zetaplus-theme') || 'dark';
  </script>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --card-bg: rgba(30, 41, 59, 0.5);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-color: #6366f1;
      --primary-light: #a5b4fc;
      --accent: #06b6d4;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* App Shell Header */
    header.app-header {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .left-branding { display: flex; align-items: center; gap: 1.25rem; }
    .platform-logo { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.25rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
    .divider-v { width: 1px; height: 24px; background: var(--border-color); }
    .school-info { display: flex; align-items: center; gap: 0.75rem; }
    .school-logo-img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); }
    .school-name { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text-main); }
    .header-controls { display: flex; align-items: center; gap: 1rem; }
    .control-group { display: flex; align-items: center; gap: 0.5rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); padding: 0.4rem 0.8rem; border-radius: 8px; }
    .control-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .control-select { background: transparent; border: none; color: var(--text-main); font-size: 0.875rem; font-weight: 600; outline: none; cursor: pointer; }
    .control-select option { background: #0f172a; color: #fff; }
    .ay-badge { background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3); color: var(--accent); padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.825rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; }
    .user-profile { display: flex; align-items: center; gap: 1rem; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 0.9rem; }
    .user-details { display: flex; flex-direction: column; }
    .user-name { font-size: 0.875rem; font-weight: 600; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }
    .btn-logout { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
    .btn-logout:hover { background: rgba(239,68,68,0.2); color: #fca5a5; border-color: rgba(239,68,68,0.4); }
    .theme-toggle { width: 38px; height: 38px; display: inline-grid; place-items: center; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.2s; }
    .theme-toggle:hover { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.45); transform: translateY(-1px); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-toggle svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }

    html[data-theme="light"] {
      --bg-dark: #f5f7fb;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --card-bg: #ffffff;
      --border-color: rgba(15, 23, 42, 0.12);
      --primary-light: #4f46e5;
      --text-main: #172033;
      --text-muted: #64748b;
    }
    html[data-theme="light"] .control-group,
    html[data-theme="light"] .btn-logout,
    html[data-theme="light"] .theme-toggle { background: #f8fafc; }
    html[data-theme="light"] .control-select option,
    html[data-theme="light"] .filter-item select { background: #fff; color: var(--text-main); }
    html[data-theme="light"] .rights-table th { background: #f8fafc; }
    html[data-theme="light"] .var-btn { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }
    html[data-theme="light"] .var-btn:hover { background: #e2e8f0; color: #172033; }
    html[data-theme="light"] .news-board-filters select, html[data-theme="light"] .news-board-form input { background:#fff; }
    html[data-theme="light"] #nbDescriptionEditor { background:#fff; }
    
    /* Dark mode styles for Quill editor */
    html[data-theme="dark"] #nbDescriptionEditor {
      background: var(--card-bg) !important;
      border-color: var(--border-color) !important;
    }
    html[data-theme="dark"] .ql-toolbar.ql-snow {
      background: rgba(30, 41, 59, 0.8) !important;
      border-color: var(--border-color) !important;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }
    html[data-theme="dark"] .ql-container.ql-snow {
      background: var(--card-bg) !important;
      border-color: var(--border-color) !important;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }
    html[data-theme="dark"] .ql-editor {
      color: var(--text-main) !important;
      background: transparent !important;
    }
    html[data-theme="dark"] .ql-editor.ql-blank::before {
      color: var(--text-muted) !important;
    }
    html[data-theme="dark"] .ql-stroke {
      stroke: var(--text-muted) !important;
    }
    html[data-theme="dark"] .ql-fill {
      fill: var(--text-muted) !important;
    }
    html[data-theme="dark"] .ql-picker {
      color: var(--text-main) !important;
    }
    html[data-theme="dark"] .ql-picker-label {
      color: var(--text-main) !important;
      border-color: var(--border-color) !important;
    }
    html[data-theme="dark"] .ql-picker-options {
      background: rgba(30, 41, 59, 0.95) !important;
      border-color: var(--border-color) !important;
    }
    html[data-theme="dark"] .ql-picker-item {
      color: var(--text-main) !important;
    }
    html[data-theme="dark"] .ql-picker-item:hover {
      color: var(--primary-light) !important;
      background: rgba(99, 102, 241, 0.2) !important;
    }
    html[data-theme="dark"] .ql-active .ql-stroke {
      stroke: var(--primary) !important;
    }
    html[data-theme="dark"] .ql-active .ql-fill {
      fill: var(--primary) !important;
    }
    html[data-theme="dark"] .ql-active .ql-picker-label {
      color: var(--primary) !important;
    }
    html[data-theme="dark"] .ql-tooltip {
      background: rgba(30, 41, 59, 0.95) !important;
      border-color: var(--border-color) !important;
      color: var(--text-main) !important;
    }
    html[data-theme="dark"] .ql-tooltip input {
      background: rgba(15, 23, 42, 0.8) !important;
      border-color: var(--border-color) !important;
      color: var(--text-main) !important;
    }

    /* App Body Layout */
    .app-body { display: flex; flex: 1; }

    /* Sidebar */
    aside.app-sidebar { width: 250px; background: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 1.5rem 0.75rem; display: flex; flex-direction: column; gap: 0.25rem; }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--text-muted); text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; cursor: pointer; }
    .nav-item.active, .nav-item:hover { background: rgba(99,102,241,0.15); color: var(--text-main); }
    .submenu-group { display: flex; flex-direction: column; padding-left: 1.5rem; gap: 0.2rem; margin-top: 0.2rem; margin-bottom: 0.4rem; }
    .submenu-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.75rem; color: var(--text-muted); text-decoration: none; border-radius: 6px; font-size: 0.825rem; font-weight: 500; transition: all 0.2s; cursor: pointer; }
    .submenu-item.active, .submenu-item:hover { background: rgba(99,102,241,0.2); color: var(--primary-light); }

    /* Main Content Area */
    main.dashboard-content { flex: 1; padding: 2rem 2.5rem; overflow-y: auto; }

    /* Content pane loading state */
    #contentArea { min-height: 200px; }
    .page-loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-muted); font-size: 1rem; gap: 0.5rem; }

    /* Page-level styles (shared across pages) */
    .page-title { font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    .page-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .filter-toolbar { display: flex; flex-wrap: wrap; gap: 1rem; background: var(--card-bg); border: 1px solid var(--border-color); padding: 1rem 1.25rem; border-radius: 12px; margin-bottom: 1.5rem; align-items: center; }
    .filter-item { display: flex; flex-direction: column; gap: 0.25rem; }
    .filter-item label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .filter-item select { background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem 0.85rem; border-radius: 8px; font-size: 0.875rem; font-weight: 600; outline: none; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .kpi-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .kpi-value { font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 800; color: var(--text-main); }
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 1.5rem; }
    .chart-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; }
    .chart-title { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; }
    .chart-canvas-wrapper { position: relative; height: 280px; width: 100%; }

    /* Admin Panel */
    .admin-panel { display: none; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; }
    .user-select-box { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .rights-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .rights-table th, .rights-table td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    .rights-table th { background: rgba(255,255,255,0.03); font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); }
    .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }
    .btn-save-rights { margin-top: 1.5rem; background: linear-gradient(135deg, var(--primary), #4f46e5); color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .module-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; display:flex; flex-direction:column; gap:0.5rem; }
    .status-tag { background: rgba(99,102,241,0.15); color: var(--primary-light); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display:inline-block; width:fit-content; }
    .var-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-family: monospace; }
    .var-btn:hover { background: #334155; color: #fff; }
    .news-board-heading, .news-board-filters, .news-board-form-grid, .news-board-actions, .notice-card-title-row, .notice-card-meta { display:flex; align-items:center; gap:0.75rem; }
    .news-board-heading, .notice-card-title-row { justify-content:space-between; }.news-board-heading { margin-bottom:1.25rem; }
    .news-board-filters { padding:1rem; margin-bottom:1rem; border:1px solid var(--border-color); border-radius:12px; background:var(--card-bg); }
    .news-board-filters label, .news-board-form label { display:flex; flex-direction:column; gap:0.35rem; color:var(--text-muted); font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
    .news-board-filters select, .news-board-form input { padding:0.6rem 0.75rem; border:1px solid var(--border-color); border-radius:8px; background:#0f172a; color:var(--text-main); font:inherit; text-transform:none; letter-spacing:normal; }
    .news-board-message { min-height:1.2rem; margin:0.5rem 0; font-size:0.875rem; }.news-board-message.success { color:#34d399; }.news-board-message.error { color:#f87171; }
    .news-board-list { display:grid; gap:0.9rem; }.notice-card { background:var(--card-bg); border:1px solid var(--border-color); border-left:4px solid var(--primary); border-radius:12px; padding:1.15rem 1.25rem; }.notice-card.is-expired { border-left-color:#f59e0b; opacity:0.8; }.notice-card-meta { flex-wrap:wrap; color:var(--text-muted); font-size:0.76rem; }.notice-card h3 { font-family:'Outfit',sans-serif; font-size:1.1rem; margin:0.75rem 0; }.notice-card-description { line-height:1.6; color:var(--text-main); }.notice-card-description :first-child { margin-top:0; }.notice-card-description :last-child { margin-bottom:0; }.notice-card-expiry { margin-top:0.75rem; color:var(--text-muted); font-size:0.8rem; }
    .notice-status { padding:0.2rem 0.5rem; border-radius:999px; font-weight:700; }.notice-status.published { color:#34d399; background:rgba(16,185,129,.13); }.notice-status.draft { color:#fbbf24; background:rgba(245,158,11,.13); }.nb-icon-action { border:0; background:transparent; color:var(--text-muted); cursor:pointer; font-size:1.15rem; padding:0.25rem; }.nb-icon-action:hover { color:var(--primary-light); }.nb-icon-action.danger:hover { color:#f87171; }.news-board-empty { padding:3rem 1rem; color:var(--text-muted); text-align:center; border:1px dashed var(--border-color); border-radius:12px; }
    .news-board-modal { position:fixed; inset:0; z-index:1000; overflow:auto; padding:3rem 1rem; background:rgba(9,13,22,.7); }.news-board-form { max-width:720px; margin:auto; padding:1.5rem; border:1px solid var(--border-color); border-radius:16px; background:var(--panel-bg); box-shadow:0 20px 50px rgba(0,0,0,.35); display:grid; gap:1rem; }.news-board-form-head { display:flex; justify-content:space-between; align-items:center; }.news-board-form h3 { font-family:'Outfit',sans-serif; }.news-board-form-grid > label { flex:1; }.news-board-form fieldset { display:flex; gap:1rem; flex-wrap:wrap; padding:0.75rem; border:1px solid var(--border-color); border-radius:8px; }.news-board-form fieldset label, .nb-inline { flex-direction:row !important; align-items:center; text-transform:none !important; }.news-board-actions { justify-content:flex-end; }
    /* Quill Editor Styles */
    .ql-toolbar { border: 1px solid var(--border-color) !important; border-top-left-radius: 8px; border-top-right-radius: 8px; background: var(--card-bg) !important; }
    .ql-container { border: 1px solid var(--border-color) !important; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; background: var(--card-bg) !important; min-height: 150px; }
    .ql-editor { min-height: 150px; color: var(--text-main) !important; }
    .ql-editor p { margin: 0; }

    @media (max-width: 768px) {
      .app-body { flex-direction: column; }
      aside.app-sidebar { width: 100% !important; flex-direction: row !important; flex-wrap: wrap; padding: 0.5rem !important; gap: 0.5rem !important; border-right: none; border-bottom: 1px solid var(--border-color); }
      main.dashboard-content { padding: 1rem !important; }
    }
  </style>
</head>
<body>

  <!-- App Shell Top Bar -->
  <header class="app-header">
    <div class="left-branding">
      <div class="platform-logo">ZetaPlus SaaS</div>
      <div class="divider-v"></div>
      <div class="school-info">
        <img id="schoolLogo" class="school-logo-img" src="" alt="School Logo" style="display: none;">
        <span id="schoolName" class="school-name">Loading school...</span>
      </div>
    </div>

    <div class="header-controls">
      <div class="control-group">
        <span class="control-label">Branch:</span>
        <select id="branchSelect" class="control-select">
          <option value="">Loading branches...</option>
        </select>
      </div>
      <div class="control-group">
        <span class="control-label">Syllabus:</span>
        <select id="syllabusSelect" class="control-select">
          <option value="">Loading syllabuses...</option>
        </select>
      </div>
      <div class="ay-badge">
        <span>📅</span>
        <span id="ayBadge">Loading Year...</span>
      </div>
    </div>

    <div class="user-profile">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode"></button>
      <div id="userAvatar" class="avatar">U</div>
      <div class="user-details">
        <span id="userName" class="user-name">User</span>
        <span id="userRoleBadge" class="user-role">Authenticated Tenant User</span>
      </div>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
  </header>

  <!-- App Main Body -->
  <div class="app-body">
    <aside class="app-sidebar" id="sidebarNav">
      <!-- Dynamic menu items injected here -->
    </aside>

    <main class="dashboard-content">
      <!-- SPA Content Area: pages are fetched and injected here -->
      <div id="contentArea">
        <div class="page-loading">⏳ Loading...</div>
      </div>
    </main>
  </div>

  <script>
    // ──────────────────────────────────────────────
    // GLOBAL STATE
    // ──────────────────────────────────────────────
    let appData = null;
    let currentActiveMenu = 'dashboard';
    let filterOptions = null;
    let chartInstances = {};

    // Track which pages have already been loaded (to avoid re-fetching)
    const loadedPages = new Set();

    // Map: menuKey → { page: 'filename.html', js: ['file1.js', ...], onLoad: fn }
    const PAGE_ROUTES = {
      dashboard:            { page: 'dashboard.html',      js: ['dashboard.js'] },
      dashboard_exam:       { page: 'dashboard.html',      js: ['dashboard.js'] },
      dashboard_fee:        { page: 'dashboard.html',      js: ['dashboard.js'] },
      dashboard_attendance: { page: 'dashboard.html',      js: ['dashboard.js'] },
      students:             { page: 'dashboard.html',      js: ['dashboard.js'] },
      staff:                { page: 'dashboard.html',      js: ['dashboard.js'] },
      timetable:            { page: 'dashboard.html',      js: ['dashboard.js'] },
      Exams:                { page: 'dashboard.html',      js: ['dashboard.js'] },
      fees:                 { page: 'dashboard.html',      js: ['dashboard.js'] },
      settings:             { page: 'dashboard.html',      js: ['dashboard.js'] },
      admin_rbac:           { page: 'admin-rbac.html',     js: ['admin-rbac.js'] },
      module_conditions:    { page: 'conditions.html',     js: ['conditions.js'] },
      admin_template:       { page: 'template-builder.html', js: ['template-builder.js'] },
      marks_entry:          { page: 'marks-entry.html',    js: ['marks-entry.js'] },
      news_board:           { page: 'news-board.html',     js: ['news-board.js'] },
    };

    // ──────────────────────────────────────────────
    // SPA ROUTER: Load HTML + JS for a page
    // ──────────────────────────────────────────────
    async function navigateTo(menuKey, title, subtitle) {
      currentActiveMenu = menuKey;
      renderSidebarNav();

      const route = PAGE_ROUTES[menuKey];
      if (!route) return;

      const contentArea = document.getElementById('contentArea');
      const pageId = route.page;

      // If this page template isn't loaded yet, fetch it
      if (!loadedPages.has(pageId)) {
        try {
          const res = await fetch(`/pages/${pageId}`);
          if (!res.ok) throw new Error(`Could not load page: ${pageId}`);
          const html = await res.text();

          if (pageId === 'dashboard.html') {
            // Dashboard is a full-page replace (the main content area)
            contentArea.innerHTML = html;
          } else {
            // Panel pages are appended after dashboard.
            // First make sure dashboard is in the DOM.
            if (!loadedPages.has('dashboard.html')) {
              const dashRes = await fetch('/pages/dashboard.html');
              contentArea.innerHTML = await dashRes.text();
              loadedPages.add('dashboard.html');
              await loadPageScripts(['dashboard.js']);
            } else {
              // Dashboard already in DOM — just remove any leftover loading spinner
              const spinner = contentArea.querySelector('.page-loading');
              if (spinner) spinner.remove();
            }
            // Silently append the panel HTML (it starts hidden via CSS)
            contentArea.insertAdjacentHTML('beforeend', html);
          }
          loadedPages.add(pageId);

          // Dynamically load the page's JS files (only once)
          await loadPageScripts(route.js);
        } catch (err) {
          console.error('[SPA Router] Error loading page:', err);
          contentArea.innerHTML = `<div class="page-loading" style="color:#ef4444;">❌ Failed to load page.</div>`;
          return;
        }
      }

      // Now activate the correct view
      activateView(menuKey, title, subtitle);
    }

    async function loadPageScripts(jsFiles) {
      const cacheBuster = Date.now(); // Force fresh load every time
      for (const jsFile of jsFiles) {
        const scriptId = `spa-script-${jsFile}`;
        if (document.getElementById(scriptId)) continue; // already loaded
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.id = scriptId;
          script.src = `/js/pages/${jsFile}?v=${cacheBuster}`;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }
    }

    function activateView(menuKey, title, subtitle) {
      // Hide all admin panels
      document.querySelectorAll('.admin-panel').forEach(p => p.style.display = 'none');
      const mainView = document.getElementById('mainViewArea');
      if (mainView) mainView.style.display = 'block';

      if (menuKey === 'module_conditions') {
        if (mainView) mainView.style.display = 'none';
        document.getElementById('conditionsBuilderPanel').style.display = 'block';
        if (typeof loadConditionMasters === 'function') loadConditionMasters();
        return;
      }

      if (menuKey === 'marks_entry') {
        if (mainView) mainView.style.display = 'none';
        document.getElementById('marksEntryPanel').style.display = 'block';
        if (typeof loadMarksEntryFilters === 'function') loadMarksEntryFilters();
        return;
      }

      if (menuKey === 'news_board') {
        if (mainView) mainView.style.display = 'none';
        document.getElementById('newsBoardPanel').style.display = 'block';
        if (typeof loadNewsBoardPage === 'function') loadNewsBoardPage();
        return;
      }

      if (menuKey === 'admin_rbac') {
        if (mainView) mainView.style.display = 'none';
        document.getElementById('adminRbacPanel').style.display = 'block';
        if (typeof openAdminRbacPanel === 'function') openAdminRbacPanel();
        return;
      }

      if (menuKey === 'admin_template') {
        if (mainView) mainView.style.display = 'none';
        document.getElementById('templateBuilderPanel').style.display = 'block';
        if (typeof loadTemplateFilters === 'function') loadTemplateFilters();
        return;
      }

      // Default dashboard-type views
      const viewTitle = document.getElementById('viewTitle');
      const viewSubtitle = document.getElementById('viewSubtitle');
      if (viewTitle) viewTitle.textContent = title || 'Dashboard';
      if (viewSubtitle) viewSubtitle.textContent = subtitle || '';

      destroyCharts();

      const filterToolbar = document.getElementById('examFilterToolbar');
      const kpiGrid = document.getElementById('examKpiGrid');

      if (menuKey === 'dashboard_exam') {
        if (filterToolbar) filterToolbar.style.display = 'flex';
        if (kpiGrid) kpiGrid.style.display = 'grid';
        if (typeof loadExamAnalyticsFiltersAndData === 'function') loadExamAnalyticsFiltersAndData();
      } else {
        if (filterToolbar) filterToolbar.style.display = 'none';
        if (kpiGrid) kpiGrid.style.display = 'none';

        const grid = document.getElementById('cardsGrid');
        if (!grid) return;
        grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(280px, 1fr))';

        if (menuKey === 'dashboard_fee') {
          grid.innerHTML = `
            <div class="module-card"><span class="status-tag">Revenue</span><h4>Term Collection</h4><p>87.5% of term tuition fees collected to date.</p></div>
            <div class="module-card"><span class="status-tag">Pending</span><h4>Outstanding Fees</h4><p>Total pending receivables: 12,450 OMR.</p></div>
          `;
        } else if (menuKey === 'dashboard_attendance') {
          grid.innerHTML = `
            <div class="module-card"><span class="status-tag">Attendance Rate</span><h4>Student Attendance</h4><p>96.8% average daily attendance for current week.</p></div>
            <div class="module-card"><span class="status-tag">Staff</span><h4>Faculty Attendance</h4><p>99.1% faculty presence across active branch.</p></div>
          `;
        } else {
          grid.innerHTML = `
            <div class="module-card"><span class="status-tag">Multi-Tenant Core</span><h4>Dynamic DB Scoping</h4><p>Tenant connections pooled server-side without credential exposure.</p></div>
            <div class="module-card"><span class="status-tag">Context Switcher</span><h4>Branch &amp; Syllabus Filtering</h4><p>Seamless context updates without re-authenticating.</p></div>
            <div class="module-card"><span class="status-tag">Academic Year</span><h4>Live Session Integration</h4><p>Active year automatically configured from tenant tables.</p></div>
          `;
        }
      }
    }

    // ──────────────────────────────────────────────
    // SESSION, HEADER & SIDEBAR
    // ──────────────────────────────────────────────
    async function loadAppSession() {
      try {
        const response = await fetch('/api/auth/me');
        if (!response.ok) { window.location.href = '/login.html'; return; }
        appData = await response.json();
        renderHeaderData();
        renderSidebarNav();
        // Navigate to default page
        await navigateTo('dashboard', 'Dashboard Overview', 'Welcome to your dedicated school management workspace.');
      } catch (err) {
        console.error('Session load error:', err);
        window.location.href = '/login.html';
      }
    }

    function renderHeaderData() {
      if (!appData || !appData.success) return;
      const { user, school, context, branches, syllabuses } = appData;
      document.getElementById('schoolName').textContent = school.schNameEn || 'School Tenant';
      if (school.schLogo) {
        const logoImg = document.getElementById('schoolLogo');
        logoImg.src = school.schLogo.startsWith('http') ? school.schLogo : `/uploads/${school.schLogo}`;
        logoImg.style.display = 'inline-block';
      }
      document.getElementById('userName').textContent = user.username || 'User';
      document.getElementById('userAvatar').textContent = (user.username || 'U').charAt(0).toUpperCase();
      if (user.isSystemAdmin) {
        document.getElementById('userRoleBadge').textContent = '🛡️ System Administrator';
        document.getElementById('userRoleBadge').style.color = '#818cf8';
      }
      document.getElementById('ayBadge').textContent = context.academicYearDes || 'Active Year';

      const branchSelect = document.getElementById('branchSelect');
      branchSelect.innerHTML = branches.map(b =>
        `<option value="${b.branchID}" ${b.branchID == context.branchID ? 'selected' : ''}>${b.branchDes} (${b.branchShortCode || 'Branch'})</option>`
      ).join('');

      const syllabusSelect = document.getElementById('syllabusSelect');
      if (!syllabuses || syllabuses.length === 0) {
        syllabusSelect.innerHTML = '<option value="">No Syllabuses</option>';
      } else {
        syllabusSelect.innerHTML = syllabuses.map(s =>
          `<option value="${s.syllabusID}" ${s.syllabusID == context.syllabusID ? 'selected' : ''}>${s.serviceName || 'Syllabus ' + s.syllabusID}</option>`
        ).join('');
      }
    }

    function renderSidebarNav() {
      const sidebarNav = document.getElementById('sidebarNav');
      if (!appData || !appData.allMenus) {
        sidebarNav.innerHTML = '';
        return;
      }

      const userMenus = appData.userMenus || [];
      const allMenus = appData.allMenus;
      let navHtml = '';

      // Filter menus to only those the user has access to
      const allowedMenus = allMenus.filter(m => userMenus.includes(m.menuKey));
      
      // Group by parentKey
      const roots = allowedMenus.filter(m => !m.parentKey);
      const childrenByParent = {};
      allowedMenus.forEach(m => {
        if (m.parentKey) {
          if (!childrenByParent[m.parentKey]) childrenByParent[m.parentKey] = [];
          childrenByParent[m.parentKey].push(m);
        }
      });

      // Build HTML
      roots.forEach(root => {
        navHtml += `<div class="nav-item ${currentActiveMenu === root.menuKey ? 'active' : ''}" onclick="navigateTo('${root.menuKey}', '${root.menuTitle}', '')">${root.icon} ${root.menuTitle}</div>`;
        
        const children = childrenByParent[root.menuKey];
        if (children && children.length > 0) {
          navHtml += `<div class="submenu-group">`;
          children.forEach(child => {
            navHtml += `<div class="submenu-item ${currentActiveMenu === child.menuKey ? 'active' : ''}" onclick="navigateTo('${child.menuKey}', '${child.menuTitle}', '')">${child.icon} ${child.menuTitle}</div>`;
          });
          navHtml += `</div>`;
        }
      });

      sidebarNav.innerHTML = navHtml;
    }

    function destroyCharts() {
      Object.keys(chartInstances).forEach(key => {
        if (chartInstances[key]) chartInstances[key].destroy();
      });
      chartInstances = {};
    }

    function insertAtCursor(textareaId, text) {
      const ta = document.getElementById(textareaId);
      if (!ta) return;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      ta.value = ta.value.substring(0, start) + text + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = start + text.length;
      ta.focus();
    }

    function updateThemeToggle() {
      const toggle = document.getElementById('themeToggle');
      const isLight = document.documentElement.dataset.theme === 'light';
      const nextTheme = isLight ? 'dark' : 'light';
      toggle.setAttribute('aria-label', `Switch to ${nextTheme} mode`);
      toggle.setAttribute('title', `Switch to ${nextTheme} mode`);
      toggle.setAttribute('aria-pressed', String(isLight));
      toggle.innerHTML = isLight
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem('zetaplus-theme', nextTheme);
      updateThemeToggle();
    }

    // Logout
    document.addEventListener('DOMContentLoaded', () => {
      updateThemeToggle();
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login.html';
      });
      loadAppSession();
    });
  </script>
</body>
</html>
