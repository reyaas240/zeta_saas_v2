<!-- Condition Builder View -->
<div id="conditionsBuilderPanel" class="admin-panel">
  <h2 class="page-title">📝 Condition Formula Builder</h2>
  <p class="page-subtitle">Define condition formulas and pass mark cutdowns for specific modules.</p>

  <div class="user-select-box">
    <label style="font-weight:600; color:var(--text-muted);">Condition Module:</label>
    <select id="condMasterSelect" class="control-select" style="background:#0f172a; padding:0.6rem 1rem; border-radius:8px; border:1px solid var(--border-color); flex:1;">
      <option value="">Select Condition Module...</option>
    </select>
  </div>

  <div id="condDetailsSection" style="display: none; flex-direction: column; gap: 1rem;">
    <div style="display:flex; gap: 1rem;">
      <label style="display:flex; align-items:center; gap:0.5rem; font-weight:600; color:var(--text-muted);">
        <input type="checkbox" id="condActiveCheck" /> Condition Active
      </label>
      <label style="display:flex; align-items:center; gap:0.5rem; font-weight:600; color:var(--text-muted); margin-left:1rem;">
        Pass Mark:
        <input type="number" id="condPassMark" style="background:#0f172a; padding:0.4rem; border-radius:8px; border:1px solid var(--border-color); color:#fff; width: 80px;" />
      </label>
      <div style="display:flex; gap:1rem; align-items:center; margin-top:0.5rem;">
        <label style="font-weight:600; color:var(--text-muted);">Branch:</label>
        <select id="condBranchSelect" class="control-select" style="background:#0f172a; padding:0.4rem 0.8rem; border-radius:8px; border:1px solid var(--border-color);">
          <option value="">All Branches</option>
        </select>
        <label style="font-weight:600; color:var(--text-muted); margin-left:0.8rem;">Syllabus:</label>
        <select id="condSyllabusSelect" class="control-select" style="background:#0f172a; padding:0.4rem 0.8rem; border-radius:8px; border:1px solid var(--border-color);">
          <option value="">All Syllabi</option>
        </select>
      </div>
    </div>

    <div style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color);">
      <h3 style="font-size: 1rem; margin-bottom: 1rem; color: #fff;">Formula Editor</h3>
      <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom: 1rem;">
        <button onclick="insertAtCursor('condFormulaText', '{subjectTotMarks}')" class="var-btn">{subjectTotMarks}</button>
        <button onclick="insertAtCursor('condFormulaText', '{subjectAvgMarks}')" class="var-btn">{subjectAvgMarks}</button>
        <button onclick="insertAtCursor('condFormulaText', '{classStudentCount}')" class="var-btn">{classStudentCount}</button>
        <button onclick="insertAtCursor('condFormulaText', '{gradeStudentCount}')" class="var-btn">{gradeStudentCount}</button>
        <button onclick="insertAtCursor('condFormulaText', '>=')" class="var-btn">&gt;=</button>
        <button onclick="insertAtCursor('condFormulaText', '<=')" class="var-btn">&lt;=</button>
        <button onclick="insertAtCursor('condFormulaText', 'IF(, , )')" class="var-btn">IF()</button>
      </div>
      <div>
        <textarea id="condFormulaText" rows="6" style="width: 100%; background:#0f172a; border:1px solid var(--border-color); color:#fff; padding:0.8rem; border-radius:8px; font-family: monospace;" placeholder="e.g. =({subjectTotMarks}>=50/{classStudentCount})*100"></textarea>
        <small style="color:var(--text-muted); display:block; margin-top:0.5rem;">Write any formula using the variables above. Supports complex mathematical and logical operations.</small>
      </div>
    </div>

    <button id="saveConditionBtn" class="btn-save-rights">Save Condition Settings</button>
  </div>
</div>
